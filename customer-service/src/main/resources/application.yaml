spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:h2:mem:customers-db
  h2:
    console:
      enabled: true
  cloud:
    config:
      enabled: false
    discovery:
      enabled: true
  graphql:
    graphiql:
      enabled: true
      path: /graphiql
  ai:
    mcp:
      server:
        protocol: streamable
        name: customer-mcp-server

server:
  port: 8083
